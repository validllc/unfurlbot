name: Dead proxy
description: A platform stopped embedding because its proxy died
title: '[dead proxy] '
labels: [proxy]
body:
  - type: markdown
    attributes:
      value: |
        This happens a lot, proxies are community-run and they go down or get their
        domain parked. Thanks for catching it.
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: e.g. Instagram
    validations:
      required: true
  - type: input
    id: proxy
    attributes:
      label: Proxy that stopped working
      placeholder: e.g. ddinstagram.com
    validations:
      required: true
  - type: input
    id: example
    attributes:
      label: A link that shows the problem
      placeholder: https://...
  - type: textarea
    id: what
    attributes:
      label: What you see instead of an embed
      placeholder: nothing / login page / parked domain ad / ...
